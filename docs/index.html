<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 웹 툴 모음 허브</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-12 px-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">🛠️ 내 프로젝트 모음</h1>
      <p class="text-slate-500 mt-2">폴더를 추가하면 메인 페이지에 자동으로 반영됩니다.</p>
    </header>

    <!-- Project Cards Grid -->
    <div id="projectGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 로딩 스켈레톤 -->
      <div class="animate-pulse bg-white p-6 rounded-2xl border border-slate-200 h-40"></div>
      <div class="animate-pulse bg-white p-6 rounded-2xl border border-slate-200 h-40"></div>
    </div>
  </div>

  <script>
    // 1. 현재 접속한 GitHub Pages 주소에서 owner와 repo 이름 자동 추출
    // 예: https://username.github.io/my-tools/ -> owner: username, repo: my-tools
    function getRepoInfo() {
      const hostname = window.location.hostname;
      const pathname = window.location.pathname.split("/").filter(Boolean);

      // 로컬 테스트(localhost) 환경용 기본값 설정 (테스트 시 본인 계정/레포명 입력)
      if (hostname === "localhost" || hostname === "127.0.0.1") {
        return { owner: "your-username", repo: "your-repo" };
      }

      const owner = hostname.split(".")[0];
      const repo = pathname[0] || "";
      return { owner, repo };
    }

    async function loadProjects() {
      const { owner, repo } = getRepoInfo();
      const grid = document.getElementById("projectGrid");

      try {
        // 2. GitHub REST API로 docs 폴더의 내용물 조회
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/docs`);
        
        if (!res.ok) {
          throw new Error("저장소 데이터를 가져올 수 없습니다. (비공개 저장소이거나 API 호출 한도 초과)");
        }

        const items = await res.json();
        
        // 3. 디렉토리(dir) 타입만 필터링
        const directories = items.filter(item => item.type === "dir");

        grid.innerHTML = "";

        if (directories.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">생성된 기능 폴더가 없습니다.</p>`;
          return;
        }

        // 4. 각 폴더별로 메타데이터(meta.json) 확인 및 카드 생성
        for (const dir of directories) {
          let title = dir.name;
          let description = "클릭하여 이동하기";
          let icon = "📁";

          // (선택) 폴더 내에 meta.json이 있다면 제목과 설명을 세련되게 표시
          try {
            const metaRes = await fetch(`./${dir.name}/meta.json`);
            if (metaRes.ok) {
              const meta = await metaRes.json();
              title = meta.title || title;
              description = meta.description || description;
              icon = meta.icon || icon;
            }
          } catch (_) {
            // meta.json 없으면 폴더명 기본값 사용
          }

          const card = document.createElement("a");
          card.href = `./${dir.name}/`;
          card.className = "group block p-6 bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-400 transition-all";
          card.innerHTML = `
            <div class="text-3xl mb-3">${icon}</div>
            <h2 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">${title}</h2>
            <p class="text-sm text-slate-500 mt-1 line-clamp-2">${description}</p>
            <span class="inline-block mt-4 text-xs font-semibold text-indigo-500 group-hover:translate-x-1 transition-transform">실행하기 →</span>
          `;
          grid.appendChild(card);
        }

      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="col-span-full p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
            목록을 불러오는 중 오류가 발생했습니다: ${err.message}
          </div>
        `;
      }
    }

    loadProjects();
  </script>
</body>
</html>
