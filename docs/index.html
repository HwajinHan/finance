<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 자산 관리 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary: #2563eb;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
        body { background: var(--bg); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; }
        
        .hero-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: #fff;
            border-radius: 20px;
            padding: 22px 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
        }
        .hero-label { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
        .hero-total { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 14px; }
        .market-pills { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; font-size: 12px; }
        .market-pill { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 12px; }

        .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .panel { display: none; }
        .panel.active { display: block; }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }

        .list-group { display: flex; flex-direction: column; gap: 10px; }
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .item-name { font-size: 14px; font-weight: 600; }
        .item-val { font-size: 15px; font-weight: 700; }
        .item-sub { display: flex; gap: 8px; font-size: 12px; color: var(--text-sub); align-items: center; }
        .badge { background: #eff6ff; color: var(--primary); font-weight: 700; padding: 2px 8px; border-radius: 6px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; color: var(--text-sub); font-size: 12px; }
        .num-col { text-align: right; }
        .loading { text-align: center; padding: 30px 0; color: var(--text-sub); font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 총 순자산 & 시장 지수 헤더 -->
        <div class="hero-card">
            <div class="hero-label">총 순자산</div>
            <div class="hero-total" id="totalNetWorth">- 원</div>
            <div class="market-pills">
                <span class="market-pill">KOSPI <strong id="kospiVal">-</strong></span>
                <span class="market-pill">NASDAQ <strong id="nasdaqVal">-</strong></span>
            </div>
        </div>

        <!-- 스크롤 탭 메뉴 -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('summary')">📊 총괄 대시보드</button>
            <button class="tab-btn" onclick="switchTab('history')">📈 자산 추이</button>
            <button class="tab-btn" onclick="switchTab('overseas')">해외주식</button>
            <button class="tab-btn" onclick="switchTab('domestic')">국내주식</button>
            <button class="tab-btn" onclick="switchTab('isa')">ISA</button>
            <button class="tab-btn" onclick="switchTab('pension')">연금&보험</button>
            <button class="tab-btn" onclick="switchTab('irp')">퇴직연금(IRP)</button>
        </div>

        <!-- 1. 총괄 대시보드 -->
        <div id="tab-summary" class="panel active">
            <div class="chart-box">
                <div class="chart-title">자산군 구성 비중</div>
                <div style="max-height: 220px; display: flex; justify-content: center;">
                    <canvas id="assetDoughnutChart"></canvas>
                </div>
            </div>
            <div class="list-group" id="summaryList">
                <div class="loading">실시간 데이터를 가져오는 중...</div>
            </div>
        </div>

        <!-- 2. 자산 추이 -->
        <div id="tab-history" class="panel">
            <div class="chart-box">
                <div class="chart-title">총 순자산 누적 추이</div>
                <canvas id="historyLineChart"></canvas>
            </div>
        </div>

        <!-- 3. 해외주식 세부 -->
        <div id="tab-overseas" class="panel">
            <div class="chart-box" style="padding: 10px; overflow-x: auto;">
                <div class="chart-title" style="margin: 8px;">해외주식 보유 종목 상세</div>
                <table>
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th class="num-col">수량</th>
                            <th class="num-col">평가금액</th>
                        </tr>
                    </thead>
                    <tbody id="overseasTableBody">
                        <tr><td colspan="3" class="loading">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 4. 국내주식 세부 -->
        <div id="tab-domestic" class="panel">
            <div class="chart-box" style="padding: 10px; overflow-x: auto;">
                <div class="chart-title" style="margin: 8px;">국내주식 보유 종목 상세</div>
                <table>
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th class="num-col">수량</th>
                            <th class="num-col">평가금액</th>
                        </tr>
                    </thead>
                    <tbody id="domesticTableBody">
                        <tr><td colspan="3" class="loading">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 5. ISA 세부 -->
        <div id="tab-isa" class="panel">
            <div class="chart-box" style="padding: 10px; overflow-x: auto;">
                <div class="chart-title" style="margin: 8px;">ISA 보유 종목 상세</div>
                <table>
                    <thead>
                        <tr>
                            <th>종목명</th>
                            <th class="num-col">수량</th>
                            <th class="num-col">평가금액</th>
                        </tr>
                    </thead>
                    <tbody id="isaTableBody">
                        <tr><td colspan="3" class="loading">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 6. 연금&보험 세부 -->
        <div id="tab-pension" class="panel">
            <div class="chart-box" style="padding: 10px; overflow-x: auto;">
                <div class="chart-title" style="margin: 8px;">연금저축 및 보험 상세</div>
                <table>
                    <thead>
                        <tr>
                            <th>상품/종목명</th>
                            <th class="num-col">수량/구분</th>
                            <th class="num-col">평가금액</th>
                        </tr>
                    </thead>
                    <tbody id="pensionTableBody">
                        <tr><td colspan="3" class="loading">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 7. 퇴직연금(IRP) 세부 -->
        <div id="tab-irp" class="panel">
            <div class="chart-box" style="padding: 10px; overflow-x: auto;">
                <div class="chart-title" style="margin: 8px;">퇴직연금(IRP) 운용 상세</div>
                <table>
                    <thead>
                        <tr>
                            <th>상품/종목명</th>
                            <th class="num-col">수량/구분</th>
                            <th class="num-col">평가금액</th>
                        </tr>
                    </thead>
                    <tbody id="irpTableBody">
                        <tr><td colspan="3" class="loading">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchSheetDataByName(sheetName) {
            const sheetId = APP_CONFIG.SPREADSHEET_ID;
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
            
            const res = await fetch(url);
            const text = await res.text();
            
            const jsonText = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
            const data = JSON.parse(jsonText);
            
            return data.table.rows.map(row => {
                return row.c ? row.c.map(cell => (cell ? (cell.f ? cell.f : (cell.v !== null ? cell.v : "")) : "")) : [];
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 각 탭의 상이한 열 구조를 유연하게 파악하여 테이블을 생성하는 스마트 렌더러
        function renderSmartTable(rows, targetElementId) {
            let html = "";
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length === 0) continue;
                
                // 1. 행 안에서 의미 있는 텍스트(종목명) 찾기
                let name = "";
                let qty = "-";
                let evalAmount = "-";

                // 빈 문자열이 아닌 칸들 수집
                const validCells = [];
                r.forEach((cell, idx) => {
                    const str = String(cell).trim();
                    if (str && str !== "-" && !str.includes("최종합계") && !str.includes("★")) {
                        validCells.push({ text: str, colIndex: idx });
                    }
                });

                if (validCells.length === 0) continue;

                // 헤더 행 건너뛰기
                if (validCells.some(c => c.text === "종목명" || c.text === "종목코드" || c.text === "상품명")) {
                    continue;
                }

                // 2. 숫자가 아닌 가장 긴 한글/영문 텍스트를 종목명으로 판단
                const textCandidates = validCells.filter(c => isNaN(c.text.replace(/,/g, '')) && !c.text.startsWith("KRX:"));
                if (textCandidates.length > 0) {
                    // 가장 구체적인 이름(길이가 적당히 긴 것)
                    name = textCandidates.reduce((a, b) => a.text.length >= b.text.length ? a : b).text;
                } else {
                    name = validCells[0].text;
                }

                // 3. 금액/숫자 형태(콤마 포함 숫자) 추출
                const numberCandidates = validCells.filter(c => {
                    const clean = c.text.replace(/,/g, '').replace(/원/g, '').trim();
                    return !isNaN(clean) && clean !== "";
                });

                if (numberCandidates.length >= 2) {
                    qty = numberCandidates[0].text;
                    evalAmount = numberCandidates[numberCandidates.length - 1].text;
                } else if (numberCandidates.length === 1) {
                    evalAmount = numberCandidates[0].text;
                }

                html += `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td class="num-col">${qty}</td>
                        <td class="num-col">${evalAmount}</td>
                    </tr>
                `;
            }
            document.getElementById(targetElementId).innerHTML = html || '<tr><td colspan="3">데이터가 없습니다.</td></tr>';
        }

        async function initApp() {
            try {
                // 1. 대시보드 탭 로드
                const dashRows = await fetchSheetDataByName(APP_CONFIG.TABS.DASHBOARD);
                
                // 총 순자산
                const totalWorth = dashRows[1][1] || "0";
                document.getElementById('totalNetWorth').innerText = (typeof totalWorth === 'number' ? totalWorth.toLocaleString() : totalWorth) + " 원";

                // KOSPI / NASDAQ 위치 동적 탐색 (1~3행 전체 스캔)
                let kospi = "-";
                let nasdaq = "-";
                for (let r = 0; r < Math.min(3, dashRows.length); r++) {
                    dashRows[r].forEach((cell, cIdx) => {
                        const cellStr = String(cell).toUpperCase();
                        if (cellStr.includes("KOSPI")) {
                            // 바로 다음 행 또는 같은 행 우측 값 확인
                            kospi = dashRows[r+1] ? dashRows[r+1][cIdx] : "-";
                            if (!kospi || kospi === "-") kospi = dashRows[r][cIdx+1] || "-";
                        }
                        if (cellStr.includes("NASDAQ")) {
                            nasdaq = dashRows[r+1] ? dashRows[r+1][cIdx] : "-";
                            if (!nasdaq || nasdaq === "-") nasdaq = dashRows[r][cIdx+1] || "-";
                        }
                    });
                }
                document.getElementById('kospiVal').innerText = kospi || "-";
                document.getElementById('nasdaqVal').innerText = nasdaq || "-";

                // 대시보드 자산 목록 및 도넛차트
                const labels = [];
                const values = [];
                let summaryHtml = "";

                for (let i = 2; i < 10; i++) {
                    const r = dashRows[i];
                    if (!r || !r[0]) continue;
                    const name = r[0];
                    const amountStr = String(r[1] || "0");
                    const rawVal = parseInt(amountStr.replace(/[^0-9]/g, '')) || 0;
                    const weight = r[2] || "0%";
                    const note = r[6] || "";

                    labels.push(name);
                    values.push(rawVal);

                    summaryHtml += `
                        <div class="item-card">
                            <div class="item-row">
                                <span class="item-name">${name}</span>
                                <span class="item-val">${amountStr} 원</span>
                            </div>
                            <div class="item-sub">
                                <span class="badge">${weight}</span>
                                <span>${note}</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('summaryList').innerHTML = summaryHtml;

                new Chart(document.getElementById('assetDoughnutChart'), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1', '#64748b', '#14b8a6']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                });

                // 2. 해외주식 렌더링
                if (APP_CONFIG.TABS.OVERSEAS) {
                    try {
                        const rows = await fetchSheetDataByName(APP_CONFIG.TABS.OVERSEAS);
                        renderSmartTable(rows, 'overseasTableBody');
                    } catch(e) { console.warn("해외주식 로드 실패", e); }
                }

                // 3. 국내주식 렌더링
                if (APP_CONFIG.TABS.DOMESTIC) {
                    try {
                        const rows = await fetchSheetDataByName(APP_CONFIG.TABS.DOMESTIC);
                        renderSmartTable(rows, 'domesticTableBody');
                    } catch(e) { console.warn("국내주식 로드 실패", e); }
                }

                // 4. ISA 렌더링
                if (APP_CONFIG.TABS.ISA) {
                    try {
                        const rows = await fetchSheetDataByName(APP_CONFIG.TABS.ISA);
                        renderSmartTable(rows, 'isaTableBody');
                    } catch(e) { console.warn("ISA 로드 실패", e); }
                }

                // 5. 연금&보험 렌더링
                if (APP_CONFIG.TABS.PENSION) {
                    try {
                        const rows = await fetchSheetDataByName(APP_CONFIG.TABS.PENSION);
                        renderSmartTable(rows, 'pensionTableBody');
                    } catch(e) { console.warn("연금&보험 로드 실패", e); }
                }

                // 6. 퇴직연금(IRP) 렌더링
                if (APP_CONFIG.TABS.IRP) {
                    try {
                        const rows = await fetchSheetDataByName(APP_CONFIG.TABS.IRP);
                        renderSmartTable(rows, 'irpTableBody');
                    } catch(e) { console.warn("IRP 로드 실패", e); }
                }

                // 7. 누적 추이 차트
                if (APP_CONFIG.TABS.HISTORY) {
                    try {
                        const hisRows = await fetchSheetDataByName(APP_CONFIG.TABS.HISTORY);
                        const dates = [];
                        const historyTotals = [];
                        for (let i = 1; i < hisRows.length; i++) {
                            const r = hisRows[i];
                            if (!r || !r[0]) continue;
                            dates.push(r[0]);
                            const val = parseInt(String(r[1] || "0").replace(/[^0-9]/g, '')) || 0;
                            historyTotals.push(val);
                        }

                        if (dates.length > 0) {
                            new Chart(document.getElementById('historyLineChart'), {
                                type: 'line',
                                data: {
                                    labels: dates,
                                    datasets: [{
                                        label: '총 순자산',
                                        data: historyTotals,
                                        borderColor: '#2563eb',
                                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                                        fill: true,
                                        tension: 0.3
                                    }]
                                },
                                options: { responsive: true, plugins: { legend: { display: false } } }
                            });
                        }
                    } catch(e) { console.warn("기록 로드 실패", e); }
                }

            } catch (err) {
                console.error("초기화 실패:", err);
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
