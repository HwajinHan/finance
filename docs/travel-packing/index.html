<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞춤 여행 준비물 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
    <!-- Header -->
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🎒 맞춤 여행 준비물 생성기</h1>
      <p class="text-sm text-slate-500 mt-1">몇 가지 질문에 답하면 딱 맞는 짐싸기 목록을 만듭니다.</p>
    </header>

    <!-- Step Progress Bar -->
    <div id="progressBarContainer" class="w-full bg-slate-200 h-2 rounded-full mb-8 overflow-hidden">
      <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 20%;"></div>
    </div>

    <!-- Step Container -->
    <main id="wizardContainer">
      <!-- Step 1: 국내 / 해외 -->
      <section class="step active" data-step="1">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">1. 어디로 떠나시나요?</h2>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="selectDestination('domestic')" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 font-medium transition text-center">🇰🇷 국내 여행</button>
          <button type="button" onclick="selectDestination('international')" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 font-medium transition text-center">✈️ 해외 여행</button>
        </div>
      </section>

      <!-- Step 2: 지역 선택 (해외 선택 시) -->
      <section class="step hidden" data-step="2">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">2. 방문 권역을 선택해주세요</h2>
        <div class="grid grid-cols-1 gap-3">
          <button type="button" onclick="selectRegion('europe')" class="p-3 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-left font-medium">유럽 (프랑스, 이탈리아, 스페인 등)</button>
          <button type="button" onclick="selectRegion('southeast-asia')" class="p-3 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-left font-medium">동남아 (베트남, 태국, 발리 등)</button>
          <button type="button" onclick="selectRegion('usa')" class="p-3 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-left font-medium">미주 / 하와이</button>
          <button type="button" onclick="selectRegion('other')" class="p-3 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-left font-medium">기타 국가</button>
        </div>
        <div id="europeDetail" class="mt-4 hidden">
          <label class="block text-sm font-medium text-slate-600 mb-1">상세 국가 (선택 사항)</label>
          <input type="text" id="countryInput" placeholder="예: 스위스, 영국" class="w-full border rounded-lg p-2.5 text-sm focus:outline-indigo-500" />
        </div>
        <button type="button" onclick="nextStep()" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700">다음</button>
      </section>

      <!-- Step 3: 여행 기간 -->
      <section class="step hidden" data-step="3">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">3. 몇 박 일정인가요?</h2>
        <div class="flex items-center gap-3">
          <input type="number" id="nightsInput" value="3" min="0" max="60" class="border rounded-xl p-3 text-lg w-28 text-center font-bold" />
          <span class="text-lg font-medium text-slate-600">박</span>
        </div>
        <button type="button" onclick="submitNights()" class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700">다음</button>
      </section>

      <!-- Step 4: 환경 & 액티비티 -->
      <section class="step hidden" data-step="4">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">4. 여행지 환경과 활동을 알려주세요</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-2">지형 및 환경</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="nature" value="city" checked class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">도시 중심</span>
              </label>
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="nature" value="mountain" class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">산 / 트레킹</span>
              </label>
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="nature" value="sea" class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">바다 / 휴양</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-2">수영/물놀이 계획이 있나요?</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="swimming" value="yes" class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">네, 수영해요</span>
              </label>
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="swimming" value="no" checked class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">아니요</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-2">주 숙소 형태</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="stayType" value="hotel" checked class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">호텔 / 리조트</span>
              </label>
              <label class="border p-3 rounded-xl text-center cursor-pointer hover:bg-slate-50 block">
                <input type="radio" name="stayType" value="other" class="hidden peer" />
                <span class="peer-checked:font-bold peer-checked:text-indigo-600">에어비앤비/게하/캠핑</span>
              </label>
            </div>
          </div>
        </div>

        <button type="button" onclick="generateList()" class="mt-6 w-full bg-emerald-600 text-white py-3 rounded-xl font-medium hover:bg-emerald-700 shadow-lg shadow-emerald-200">준비물 리스트 생성하기 ✨</button>
      </section>

      <!-- Step 5: 최종 리스트 출력 -->
      <section class="step hidden" data-step="5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-slate-900">당신만을 위한 패킹 리스트</h2>
          <button onclick="location.reload()" class="text-xs text-slate-400 underline hover:text-slate-600">처음부터 다시</button>
        </div>
        <div id="resultsContainer" class="space-y-4 max-h-96 overflow-y-auto pr-2"></div>
      </section>
    </main>
  </div>

  <script src="rules.js"></script>
  <script>
    const userAnswers = {
      destinationType: null,
      region: null,
      country: "",
      nights: 0,
      nature: "city",
      hasSwimming: false,
      stayType: "hotel"
    };

    let currentStep = 1;

    function setStep(stepNum) {
      document.querySelectorAll(".step").forEach((el) => el.classList.add("hidden"));
      const target = document.querySelector(`.step[data-step="${stepNum}"]`);
      if (target) target.classList.remove("hidden");
      currentStep = stepNum;
      document.getElementById("progressBar").style.width = `${(stepNum / 5) * 100}%`;
    }

    function selectDestination(type) {
      userAnswers.destinationType = type;
      if (type === "domestic") {
        setStep(3); // 해외가 아니면 지역 선택 건너뛰기
      } else {
        setStep(2);
      }
    }

    function selectRegion(region) {
      userAnswers.region = region;
      const europeDetail = document.getElementById("europeDetail");
      if (region === "europe") {
        europeDetail.classList.remove("hidden");
      } else {
        europeDetail.classList.add("hidden");
      }
    }

    function nextStep() {
      if (userAnswers.region === "europe") {
        userAnswers.country = document.getElementById("countryInput").value.trim();
      }
      setStep(3);
    }

    function submitNights() {
      userAnswers.nights = parseInt(document.getElementById("nightsInput").value, 10) || 0;
      setStep(4);
    }

    function generateList() {
      userAnswers.nature = document.querySelector('input[name="nature"]:checked').value;
      userAnswers.hasSwimming = document.querySelector('input[name="swimming"]:checked').value === "yes";
      userAnswers.stayType = document.querySelector('input[name="stayType"]:checked').value;

      // rules.js에 선언된 PACKING_RULES 기반 필터링
      const matchedItems = PACKING_RULES.filter(rule => rule.condition(userAnswers));

      // 카테고리별 그룹화
      const grouped = {};
      matchedItems.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      // UI 렌더링
      const container = document.getElementById("resultsContainer");
      container.innerHTML = "";

      Object.keys(grouped).forEach(category => {
        const catBox = document.createElement("div");
        catBox.className = "border rounded-xl p-4 bg-slate-50";

        let html = `<h3 class="font-bold text-slate-700 text-sm mb-2">${category}</h3><ul class="space-y-2">`;
        grouped[category].forEach((item, idx) => {
          const qty = item.quantity ? ` <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">${item.quantity(userAnswers)}</span>` : "";
          html += `
            <li class="flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" id="item-${category}-${idx}" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4 cursor-pointer" />
              <label for="item-${category}-${idx}" class="cursor-pointer select-none">${item.name}${qty}</label>
            </li>
          `;
        });
        html += `</ul>`;
        catBox.innerHTML = html;
        container.appendChild(catBox);
      });

      document.getElementById("progressBarContainer").classList.add("hidden");
      setStep(5);
    }
  </script>
</body>
</html>
